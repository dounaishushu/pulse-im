# Keep browser sessions on the canonical HTTPS origin.
server {
    listen 80;
    server_name web.imapi.shop;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/pulse-im/web;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 303 https://api.imapi.shop$request_uri; }
}

# TLS redirect (install after the certificate has been issued).
server {
    listen 443 ssl;
    server_name web.imapi.shop;
    ssl_certificate /www/server/panel/vhost/letsencrypt/web.imapi.shop/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/letsencrypt/web.imapi.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/pulse/nginx/security-headers.conf;
    location / { return 303 https://api.imapi.shop$request_uri; }
}
