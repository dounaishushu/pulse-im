# Existing host Nginx terminates TLS. Keep this file outside the served tree.
# API, admin and WebSocket certificates are managed by the existing panel.
# Install security/nginx-http.conf once in the surrounding http context first.
server {
    listen 80;
    server_name api.imapi.shop admin.imapi.shop wss.imapi.shop;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/pulse-im/web;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name api.imapi.shop;
    ssl_certificate /www/server/panel/vhost/cert/api.imapi.shop/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.imapi.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/pulse/current/web;
    index index.html;
    include /etc/pulse/nginx/security-server.conf;
    client_max_body_size 120m;
    client_body_timeout 120s;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/pulse-im/web;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ (^|/)\. { return 404; }
    location ~* \.php(?:/|$) { return 404; }
    location = /healthz { include /etc/pulse/nginx/proxy.conf; }
    location = /readyz { include /etc/pulse/nginx/proxy.conf; }
    location = /api/v2/realtime { include /etc/pulse/nginx/websocket.conf; }
    location ^~ /api/v2/ { include /etc/pulse/nginx/proxy.conf; }
    location ^~ /api/ { return 410; }
    location ^~ /storage/ { return 410; }
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/pulse/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name admin.imapi.shop;
    ssl_certificate /www/server/panel/vhost/cert/admin.imapi.shop/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/admin.imapi.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/pulse/current/admin;
    index index.html;
    include /etc/pulse/nginx/security-server.conf;
    client_max_body_size 120m;
    client_body_timeout 120s;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/pulse-im/web;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ (^|/)\. { return 404; }
    location ~* \.php(?:/|$) { return 404; }
    location = /api/v2/realtime { include /etc/pulse/nginx/websocket.conf; }
    location ^~ /api/v2/ { include /etc/pulse/nginx/proxy.conf; }
    location ^~ /api/ { return 410; }
    location ^~ /storage/ { return 410; }
    location = /entry/ {
        add_header Cache-Control "no-store" always;
        include /etc/pulse/nginx/security-headers.conf;
        try_files /entry.html =404;
    }
    location / {
        add_header Cache-Control "no-store" always;
        include /etc/pulse/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name wss.imapi.shop;
    ssl_certificate /www/server/panel/vhost/cert/wss.imapi.shop/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/wss.imapi.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/pulse/nginx/security-server.conf;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/pulse-im/web;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /api/v2/realtime { include /etc/pulse/nginx/websocket.conf; }
    location = /ws { return 410; }
    location / { return 404; }
}
