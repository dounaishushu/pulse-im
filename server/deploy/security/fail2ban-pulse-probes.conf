[Definition]
# Only explicit scanner paths tagged by the trusted Nginx map count. A normal
# 401/403/404, a failed login, a stale session or an expired grant never counts.
# Fail2ban removes the recognized date before matching, leaving empty brackets.
failregex = ^<HOST> - \[[^\]]*\] "[^"]+" (?:400|403|404|410|444) \d+ host="[^"]+" [^\r\n]* probe=1 rid=[0-9a-f]+$
ignoreregex =
