# Include once in the Nginx http context, before the Pulse virtual hosts.
# Neither query strings nor cookies, headers, bodies or media tokens are logged.
map $uri $pulse_log_uri {
    default $uri;
    ~^/api/v2/media-grants/[^/]+/(.*)$ /api/v2/media-grants/[redacted]/$1;
    ~^/api/v2/users/by-account/ /api/v2/users/by-account/[redacted];
}

map $uri $pulse_probe {
    default 0;
    ~*(^|/)\.(?:env(?:[./]|$)|git(?:/|$)|svn(?:/|$)) 1;
    ~*^/(?:wp-admin|wp-content|wp-includes|wordpress|phpmyadmin|vendor/phpunit|cgi-bin|actuator)(?:/|$) 1;
    ~*^/(?:wp-login|xmlrpc|phpinfo|info|config|shell|webshell)\.php(?:/|$) 1;
    ~*^/(?:server-status|server-info|HNAP1|boaform)(?:/|$) 1;
}

map $uri $pulse_auth_key {
    default "";
    /api/v2/auth/login $binary_remote_addr;
    /api/v2/admin/auth/login $binary_remote_addr;
    /api/v2/auth/register $binary_remote_addr;
    /api/v2/auth/captcha $binary_remote_addr;
}

limit_req_zone $pulse_auth_key zone=pulse_auth:10m rate=5r/s;

log_format pulse_security escape=json '$remote_addr - [$time_local] '
    '"$request_method $pulse_log_uri $server_protocol" $status $body_bytes_sent '
    'host="$host" rt=$request_time upstream=$upstream_response_time '
    'probe=$pulse_probe rid=$request_id';
