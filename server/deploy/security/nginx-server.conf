# HTTPS server context only. No global connection or media request limits.
server_tokens off;
access_log /var/log/pulse/nginx-access.log pulse_security buffer=64k flush=1s;
# Nginx error messages can contain the original URI, including a grant token.
# Keep routine request errors out of that log; status and latency remain above.
error_log /var/log/pulse/nginx-error.log crit;
limit_req zone=pulse_auth burst=100 nodelay;
limit_req_status 429;
error_page 429 = @pulse_rate_limited;
location @pulse_rate_limited {
    default_type application/json;
    add_header Retry-After "5" always;
    include /etc/pulse/nginx/security-headers.conf;
    return 429 '{"error":{"code":"rate_limited","retryable":true}}';
}
if ($pulse_probe) { return 404; }
include /etc/pulse/nginx/security-headers.conf;
