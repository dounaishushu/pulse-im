[program:pulse-im-maintenance]
directory=/www/wwwroot/pulse-im/backend
command=/www/server/php/82/bin/php /www/wwwroot/pulse-im/backend/bin/maintenance-worker.php
user=www
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/www/wwwroot/pulse-im/backend/runtime/maintenance-worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
