[program:pulse-im-admin-ip-bot]
directory=/www/wwwroot/pulse-im/backend
command=/usr/bin/php /www/wwwroot/pulse-im/backend/bin/admin-ip-telegram-bot.php
user=www
autostart=false
autorestart=true
startsecs=3
stopwaitsecs=35
stopasgroup=true
killasgroup=true
stdout_logfile=/www/wwwroot/pulse-im/backend/runtime/admin-ip-bot.stdout.log
stderr_logfile=/www/wwwroot/pulse-im/backend/runtime/admin-ip-bot.stderr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
