[program:pulse-im-dispatch]
directory=/www/wwwroot/pulse-im/backend
command=/usr/bin/php /www/wwwroot/pulse-im/backend/bin/dispatch-worker.php
user=www
autostart=true
autorestart=true
startsecs=3
startretries=20
exitcodes=0
stopsignal=TERM
stopwaitsecs=40
stopasgroup=true
killasgroup=true
stdout_logfile=/www/wwwroot/pulse-im/backend/runtime/dispatch.stdout.log
stderr_logfile=/www/wwwroot/pulse-im/backend/runtime/dispatch.stderr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
