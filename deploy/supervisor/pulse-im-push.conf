[program:pulse-im-push]
directory=/www/wwwroot/pulse-im/backend
command=/usr/bin/php /www/wwwroot/pulse-im/backend/bin/push-worker.php
user=www
autostart=false
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/www/wwwroot/pulse-im/backend/runtime/push.stdout.log
stderr_logfile=/www/wwwroot/pulse-im/backend/runtime/push.stderr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
