[program:pulse-im-websocket]
directory=/www/wwwroot/pulse-im/backend
command=/usr/bin/php /www/wwwroot/pulse-im/backend/bin/websocket.php start
user=www
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/www/wwwroot/pulse-im/backend/runtime/websocket.stdout.log
stderr_logfile=/www/wwwroot/pulse-im/backend/runtime/websocket.stderr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
redirect_stderr=false
environment=APP_ENV="production"
