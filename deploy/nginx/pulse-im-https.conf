# Replace the domain names and certificate paths before enabling this file.

server {
    listen 80;
    server_name im.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name im.example.com;
    client_max_body_size 60m;

    ssl_certificate /www/server/panel/vhost/cert/im.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/im.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /www/wwwroot/pulse-im/web;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ { rewrite ^/api/(.*)$ /index.php/$1 last; }
    location = /ops/admin-ip-allowlist { rewrite ^ /index.php/ops/admin-ip-allowlist last; }
    location ~* ^/admin(?:/|$) { return 404; }
    location ~ ^/index\.php(/|$) {
        root /www/wwwroot/pulse-im/backend/public;
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/pulse-im/backend/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
    }
    location ^~ /storage/ {
        rewrite ^/storage/(.*)$ /index.php/media?path=$1 last;
    }
    location /ws {
        proxy_pass http://127.0.0.1:8282;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.im.example.com;
    client_max_body_size 60m;

    ssl_certificate /www/server/panel/vhost/cert/im.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/im.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # No direct static root/alias for admin: HTML and every JS/CSS request pass the same IP gate.
    root /www/wwwroot/pulse-im/backend/public;
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/pulse-im/backend/public/admin.php;
        fastcgi_param SCRIPT_NAME /admin.php;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_no_cache 1;
        fastcgi_cache_bypass 1;
        fastcgi_no_cache 1;
        fastcgi_cache_bypass 1;
    }
    location /api/ { rewrite ^/api/(.*)$ /index.php/$1 last; }
    location = /ops/admin-ip-allowlist { rewrite ^ /index.php/ops/admin-ip-allowlist last; }
    location ~ ^/index\.php(/|$) {
        root /www/wwwroot/pulse-im/backend/public;
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/pulse-im/backend/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param ADMIN_ACCESS_REQUIRED 1;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
    }
}

# Unlisted addresses receive 404 even on HTTP. Listed addresses may follow the HTTPS redirect.
server {
    listen 80;
    server_name admin.im.example.com;
    root /www/wwwroot/pulse-im/backend/public;
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/pulse-im/backend/public/admin.php;
        fastcgi_param SCRIPT_NAME /admin.php;
        fastcgi_param ADMIN_HTTPS_HOST admin.im.example.com;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_no_cache 1;
        fastcgi_cache_bypass 1;
    }
}
